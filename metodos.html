<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Clasificador de números</title>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-gray-50 to-slate-200 flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-8 space-y-5 border border-white/50">
    <h1 class="text-3xl font-semibold text-slate-900 tracking-tight">Clasificador de números</h1>
    <p class="text-sm text-slate-500">Ingresa un número y presiona el botón.</p>

    <div>
      <label for="numero" class="block mb-1 font-medium">Número</label>
      <input
        type="number"
        id="numero"
        class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-slate-400 transition" 
      >
    </div>

    <button
      type="button"
      id="btnClasificar"
      class="w-full rounded-2xl bg-black text-white py-3 font-medium tracking-wide shadow-lg hover:scale-[1.02] hover:bg-slate-800 transition-all duration-200"
    >
      Clasificar
    </button>

    <p id="resultado" class="text-lg font-medium text-slate-800 text-center py-4 rounded-2xl bg-slate-100 border border-slate-200"></p>
  </div>

  <script src="metodos.js"></script>
</body>
</html>
